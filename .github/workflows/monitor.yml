name: Monitor CEN TC114

on:
schedule:
- cron: '0 */6 * * *'

workflow_dispatch:

permissions:
contents: write

jobs:
monitor:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Python Packages
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Install Chromium
    run: |
      playwright install chromium

  - name: Run Monitor
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TO_EMAILS: ${{ secrets.TO_EMAILS }}
    run: |
      python monitor.py

  - name: Debug Status File
    run: |
      echo "===== LAST STATUS ====="
      cat last_status.json || true

  - name: Commit Status
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"

      git status

      git add last_status.json

      git status

      git diff --cached --quiet || git commit -m "Update status file"

      git push
```
